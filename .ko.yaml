defaultBaseImage: cgr.dev/chainguard/busybox:latest@sha256:972a590ee3f5f636860c5a9e40121ce30ad07deff5c91a035469b0e70c3a4dcf
defaultPlatforms:
  - linux/amd64
  - linux/arm64
defaultEnv:
