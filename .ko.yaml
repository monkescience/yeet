defaultBaseImage: cgr.dev/chainguard/busybox:latest@sha256:55c109b57218f83ae877b5a306d12e8299f0d6b98d00e02a0cadc2247b24fed4
defaultPlatforms:
  - linux/amd64
  - linux/arm64
defaultEnv:
  - CGO_ENABLED=0
builds:
  - id: yeet
    dir: .
    main: ./cmd/yeet
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/monkescience/yeet/internal/build.version={{.Env.VERSION}}
