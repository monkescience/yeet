defaultBaseImage: cgr.dev/chainguard/busybox:latest@sha256:9cf938251dfb3cc081ef9847e79c203b5de90ecc20855e40bef8a7cc191bb218
defaultPlatforms:
  - linux/amd64
  - linux/arm64
defaultEnv:
  - CGO_ENABLED=0
builds:
  - id: yeet
    dir: .
    main: ./cmd/yeet
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/monkescience/yeet/internal/build.version={{.Env.VERSION}}
      - -X github.com/monkescience/yeet/internal/telemetry.namespace={{ index .Env "TELEMETRYDECK_NAMESPACE" }}
      - -X github.com/monkescience/yeet/internal/telemetry.appID={{ index .Env "TELEMETRYDECK_APP_ID" }}
