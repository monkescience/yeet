defaultBaseImage: cgr.dev/chainguard/busybox:latest@sha256:b225a610a9b461ee2ebaa18ec08d58766d07bba638e6a0fd3cc0d3494bd6c642
defaultPlatforms:
  - linux/amd64
  - linux/arm64
defaultEnv:
  - CGO_ENABLED=0
builds:
  - id: yeet
    dir: .
    main: ./cmd/yeet
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/monkescience/yeet/internal/build.version={{.Env.VERSION}}
