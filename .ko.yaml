defaultBaseImage: cgr.dev/chainguard/busybox:latest@sha256:74b4b418e44274f80a44e54fa9816a8417a251102493aa08396f02d3c6d93307
defaultPlatforms:
  - linux/amd64
  - linux/arm64
defaultEnv:
