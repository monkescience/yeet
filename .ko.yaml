defaultBaseImage: cgr.dev/chainguard/busybox:latest@sha256:95d25753220528add19b287f2b050397302df56b8b38c4a2d649cd39a7dfb4f9
defaultPlatforms:
  - linux/amd64
  - linux/arm64
defaultEnv:
  - CGO_ENABLED=0
builds:
  - id: yeet
    dir: .
    main: ./cmd/yeet
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/monkescience/yeet/internal/build.version={{.Env.VERSION}}
