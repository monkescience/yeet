provider: github
branch: main
repository:
  github:
    host: github.com
    owner: testorg
    repo: testrepo
release:
  pull_request_mode: independent
  groups:
    apps:
      targets: [api, web]
targets:
  api:
    type: path
    path: api/
    tag_prefix: api-v
    changelog:
      file: api/CHANGELOG.md
    version_files:
      - path: VERSION.txt
        format: markers
  web:
    type: path
    path: web/
    tag_prefix: web-v
    changelog:
      file: web/CHANGELOG.md
    version_files:
      - path: VERSION.txt
        format: markers
