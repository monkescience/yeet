provider: github
branch: main
repository:
  github:
    host: github.com
    owner: testorg
    repo: testrepo
release:
  pull_request_mode: independent
  groups:
    backend:
      targets:
        - api
        - worker
targets:
  api:
    type: path
    path: api/
    tag_prefix: api-v
    changelog:
      file: api/CHANGELOG.md
  worker:
    type: path
    path: worker/
    tag_prefix: worker-v
    changelog:
      file: worker/CHANGELOG.md
