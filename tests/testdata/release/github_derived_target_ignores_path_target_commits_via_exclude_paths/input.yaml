provider: github
branch: main
repository:
  github:
    host: github.com
    owner: testorg
    repo: testrepo
targets:
  api:
    type: path
    path: services/api
    tag_prefix: api-v
  root:
    type: derived
    path: .
    tag_prefix: v
    includes:
      - api
    exclude_paths:
      - services/api
