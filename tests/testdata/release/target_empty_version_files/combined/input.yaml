provider: github
branch: main
repository:
  github:
    host: github.com
    owner: testorg
    repo: testrepo
version_files:
  - VERSION.txt
targets:
  api:
    type: path
    path: api/
    tag_prefix: api-v
    changelog:
      file: api/CHANGELOG.md
    version_files: []
  web:
    type: path
    path: web/
    tag_prefix: web-v
    changelog:
      file: web/CHANGELOG.md
