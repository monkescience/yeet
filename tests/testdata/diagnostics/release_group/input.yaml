provider: github
branch: main
repository:
  github:
    host: github.com
    owner: testorg
    repo: testrepo
release:
  pull_request_mode: independent
  pr_title_group: "chore: release wave"
  groups:
    BackendTeam:
      targets:
        - api
        - web
targets:
  api:
    type: path
    path: api/
    tag_prefix: api-v
    changelog:
      file: api/CHANGELOG.md
  web:
    type: path
    path: web/
    tag_prefix: web-v
    changelog:
      file: web/CHANGELOG.md
