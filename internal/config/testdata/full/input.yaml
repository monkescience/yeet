versioning: calver
branch: develop
provider: gitlab
version_files:
  - VERSION
  - cmd/yeet/version.txt
repository:
  remote: upstream
  gitlab:
    host: gitlab.company.com
    project: group/subgroup/service
changelog:
  file: CHANGES.md
  include:
    - feat
    - fix
  sections:
    feat: New Features
    fix: Bug Fixes
calver:
  format: YYYY.0M.MICRO
release:
  branch_template: 'automation/release-{{ .Branch }}'
  pr_title: 'release {{ .Tag }}'
  pr_title_group: 'release {{ .TargetCount }} targets'
  commit_subject: 'commit {{ .Tag }}'
  commit_subject_group: 'commit {{ .TargetCount }} targets'
  auto_merge: true
  auto_merge_force: true
  auto_merge_method: rebase
  pr_body_header: |-
    ## Release checklist
    - [ ] smoke test
  pr_body_footer: _Generated by automation_
  pr_body_max_length: 3000
targets:
  api:
    type: path
    path: services/api
    tag_prefix: api-v
