name: Publish Binaries

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v0.4.1)
        required: true

permissions:
  contents: read

concurrency:
  group: yeet-binaries-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  GORELEASER_VERSION: v2.17.0 # renovate: datasource=github-releases depName=goreleaser/goreleaser
  COSIGN_VERSION: v3.1.2 # renovate: datasource=github-releases depName=sigstore/cosign

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Generate Homebrew tap token
        id: generate-tap-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.HOMEBREW_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap

      - name: Generate Scoop bucket token
        id: generate-scoop-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.SCOOP_APP_ID }}
          private-key: ${{ secrets.SCOOP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: scoop-bucket

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ steps.generate-tap-token.outputs.token }}
          SCOOP_BUCKET_TOKEN: ${{ steps.generate-scoop-token.outputs.token }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      - name: Enable auto-merge on Homebrew tap PR
        if: ${{ !contains(env.RELEASE_TAG, '-') }}
        env:
          GH_TOKEN: ${{ steps.generate-tap-token.outputs.token }}
        run: |
          PR_URL=$(gh pr list --repo monkescience/homebrew-tap --head "yeet-${{ env.RELEASE_TAG }}" --json url --jq '.[0].url')
          if [ -n "$PR_URL" ]; then
            gh pr merge --auto --squash "$PR_URL" --repo monkescience/homebrew-tap
          fi

      - name: Enable auto-merge on Scoop bucket PR
        if: ${{ !contains(env.RELEASE_TAG, '-') }}
        env:
          GH_TOKEN: ${{ steps.generate-scoop-token.outputs.token }}
        run: |
          PR_URL=$(gh pr list --repo monkescience/scoop-bucket --head "yeet-${{ env.RELEASE_TAG }}" --json url --jq '.[0].url')
          if [ -n "$PR_URL" ]; then
            gh pr merge --auto --squash "$PR_URL" --repo monkescience/scoop-bucket
          fi
