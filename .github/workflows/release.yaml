name: Release

on:
  push:
    branches:
      - main
      - beta
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yeet-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.YEET_APP_ID }}
          private-key: ${{ secrets.YEET_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Run yeet release
        run: >-
          go run
          -ldflags "-X github.com/monkescience/yeet/internal/telemetry.namespace=${TELEMETRYDECK_NAMESPACE}
          -X github.com/monkescience/yeet/internal/telemetry.appID=${TELEMETRYDECK_APP_ID}"
          ./cmd/yeet --verbose release
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
          TELEMETRYDECK_NAMESPACE: ${{ vars.TELEMETRYDECK_NAMESPACE }}
          TELEMETRYDECK_APP_ID: ${{ vars.TELEMETRYDECK_APP_ID }}
